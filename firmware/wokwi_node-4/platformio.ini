; PlatformIO — build firmware untuk Wokwi for VS Code.
; Wokwi TIDAK meng-compile .ino sendiri; build dulu lewat PlatformIO, lalu
; wokwi.toml menunjuk ke .pio/build/esp32dev/firmware.bin.
;
;   pio run                       # compile
;   F1 -> "Wokwi: Start Simulator" (di VS Code)
;
; URL tunnel di-hardcode di src/sketch.ino tiap node (bukan di sini).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -D NODE_ID=\"wokwi-4\"
